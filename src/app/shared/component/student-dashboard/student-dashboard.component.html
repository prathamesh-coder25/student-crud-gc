
<div class="row">
    <div class="col-md-4">
        <app-student-form
            (emitUpdateStd)="getUpdateStd($event)"
            [editStd]="getEditStd"
            (emitNewStd)="getNewStd($event)">
        </app-student-form>
    </div>
    <div class="col-md-8">
        <app-student-table
        (emitStdObj)="getEditObj($event)"
        [getStds]="stdArr"
        ></app-student-table>
    </div>
</div>
