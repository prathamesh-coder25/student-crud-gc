<div class="card">
    <div class="card-body">

        <h2>Add Student</h2>

        <form #stdForm="ngForm" (ngSubmit)="onAddStudent()">

            <div class="form-group mb-2">
                <label>First Name*</label>

                <input
                    type="text"
                    name="fname"
                    ngModel
                    required
                    class="form-control">
            </div>

            <div class="form-group mb-2">
                <label>Last Name*</label>

                <input
                    type="text"
                    name="lname"
                    ngModel
                    required
                    class="form-control">
            </div>

            <!-- Email -->
            <div class="form-group mb-2">
                <label>Email*</label>

                <input
                    type="email"
                    name="email"
                    ngModel
                    required
                    class="form-control">
            </div>

            <!-- Contact -->
            <div class="form-group mb-2">
                <label>Contact*</label>

                <input
                    type="text"
                    name="contact"
                    ngModel
                    required
                    class="form-control">
            </div>

            <!-- Active -->
            <div class="form-group mb-3">
                <label>Is Active*</label>

                <select
                    name="isActive"
                    ngModel
                    required
                    class="form-control">

                    <option [ngValue]="true">YES</option>
                    <option [ngValue]="false">NO</option>

                </select>
            </div>

            <!-- Button -->
            <button
                type="submit"
                [disabled]="stdForm.invalid"
                mat-raised-button
                color="primary"
                class="w-100">

                ADD STUDENT

            </button>

        </form>

    </div>
</div>
